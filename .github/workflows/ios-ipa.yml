name: iOS unsigned IPA

# 在 GitHub 的 macOS 机器上编出未签名的 .ipa，再用 Sideloadly / AltStore 在本机自签安装。
# 免费 Apple ID 就够，不需要 99 美元的开发者账号。
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ipa.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/WorldVinyl.xcodeproj \
            -scheme WorldVinyl \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/WorldVinyl.app"
          test -d "$APP_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist"
          rm -rf Payload WorldVinyl-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry WorldVinyl-unsigned.ipa Payload
          shasum -a 256 WorldVinyl-unsigned.ipa | tee SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldVinyl-unsigned-ipa
          path: |
            WorldVinyl-unsigned.ipa
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
